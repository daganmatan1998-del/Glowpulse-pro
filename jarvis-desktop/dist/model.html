<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS — 3D</title>
<!--
  A window of its own, deliberately NOT index.html with a flag.

  The orb's page is one 600KB file that starts a microphone, a scheduler, a
  hologram and a conversation the moment it loads. Opening a second copy of
  that to look at a mesh would run all of it twice. This is the viewer and
  nothing else, off the same vendored three.js, so the model can sit beside
  the work it is about — resized, dragged and closed like any other window.

  The model to show arrives in the query string: model.html?glb=<url>.
-->
<style>
  :root{
    --cyan:#5fe8ff; --bg:#05070d; --dim:170,200,220;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden;
             font-family:'Courier New',monospace; color:var(--cyan); }
  #stage{ position:absolute; inset:0; }
  canvas{ display:block; }
  #bar{
    position:absolute; left:0; right:0; bottom:0; display:flex; gap:1px;
    background:rgba(0,0,0,0.55); border-top:1px solid rgba(95,232,255,0.25);
  }
  #bar button{
    flex:1; min-height:34px; background:rgba(95,232,255,0.06); border:none;
    border-right:1px solid rgba(95,232,255,0.18); color:var(--cyan);
    font-family:inherit; font-size:10px; letter-spacing:1.5px; cursor:pointer;
  }
  #bar button:last-child{ border-right:none; }
  #bar button:hover{ background:rgba(95,232,255,0.18); }
  #bar button.on{ background:rgba(95,232,255,0.22); }
  #note{
    position:absolute; left:0; right:0; top:0; padding:8px 10px; font-size:11px;
    letter-spacing:1px; color:rgba(var(--dim),0.75); background:rgba(0,0,0,0.4);
    pointer-events:none;
  }
  #err{ padding:14px; font-size:12px; line-height:1.6; color:#ff9d9d; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="note">loading…</div>
<div id="bar">
  <button id="spinBtn" class="on">SPIN</button>
  <button id="wireBtn">WIRE</button>
  <button id="bgBtn">BACKDROP</button>
  <button id="fitBtn">FIT</button>
</div>

<script src="./vendor/three/build/three.min.js"></script>
<script src="./vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="./vendor/three/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  "use strict";
  const note = document.getElementById('note');
  const stage = document.getElementById('stage');

  function fail(msg){
    note.style.display = 'none';
    stage.innerHTML = '<div id="err">' + msg + '</div>';
  }
  if(!window.THREE){ fail('three.js did not load from ./vendor/three/.'); return; }

  const glb = new URLSearchParams(location.search).get('glb');
  if(!glb){ fail('No model was given. This window is opened by JARVIS with a model to show.'); return; }

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070d);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 2000);

  /* Three lights, not one. A single source makes every curve read as a flat
     silhouette; a key, a fill from the opposite side and a rim behind are
     what let you see the shape of a thing you are about to manufacture. */
  scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x0a1018, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 2.1);  key.position.set(4, 6, 5);
  const fill = new THREE.DirectionalLight(0x9fd0ff, 0.7); fill.position.set(-5, 2, -3);
  const rim  = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(0, 3, -6);
  scene.add(key, fill, rim);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  let model = null, spin = true, wire = false, dark = true;

  function resize(){
    const w = innerWidth, h = Math.max(1, innerHeight - 34);
    renderer.setSize(w, h, false);
    renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  /* Framed from the bounding sphere and the NARROWER of the two fields of
     view, so a wide flat object still fits when the window is tall and thin.
     Re-run on FIT, because the window can be resized to any shape. */
  function frame(){
    if(!model) return;
    const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
    const vFov = camera.fov * Math.PI / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    const dist = (sphere.radius / Math.sin(Math.min(vFov, hFov) / 2)) * 1.15;
    controls.target.copy(sphere.center);
    camera.position.set(sphere.center.x, sphere.center.y + sphere.radius * 0.3, sphere.center.z + dist);
    camera.near = Math.max(0.001, dist / 1000);
    camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.update();
  }

  new THREE.GLTFLoader().load(glb, (gltf)=>{
    model = gltf.scene;
    scene.add(model);
    resize();
    frame();
    note.style.display = 'none';
  }, (ev)=>{
    if(ev && ev.total) note.textContent = 'loading… ' + Math.round(ev.loaded / ev.total * 100) + '%';
  }, ()=>{
    fail('The model could not be loaded. The link may have expired — ask JARVIS to make it again.');
  });

  document.getElementById('spinBtn').addEventListener('click', (e)=>{
    spin = !spin; e.target.classList.toggle('on', spin);
  });
  document.getElementById('wireBtn').addEventListener('click', (e)=>{
    wire = !wire; e.target.classList.toggle('on', wire);
    if(model) model.traverse(o => { if(o.isMesh && o.material) o.material.wireframe = wire; });
  });
  document.getElementById('bgBtn').addEventListener('click', (e)=>{
    dark = !dark; e.target.classList.toggle('on', !dark);
    scene.background = new THREE.Color(dark ? 0x05070d : 0xe9eef3);
  });
  document.getElementById('fitBtn').addEventListener('click', frame);

  resize();
  (function tick(){
    requestAnimationFrame(tick);
    if(spin && model) model.rotation.y += 0.004;
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
